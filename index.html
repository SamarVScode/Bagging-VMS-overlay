<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bagging & Seal Video Verification System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* ─── Top-Level Camera Overlay ────────────────────────
       Lives outside the GAS iframe with 100% native getUserMedia() access
    ────────────────────────────────────────────────────── */
    #camera-bridge-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(8px);
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
    }

    #camera-bridge-overlay.active {
      display: flex;
    }

    .bridge-viewport-card {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 420px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #3b82f6;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bridge-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .overlay-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    @keyframes pulse-recording {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    .animate-rec {
      animation: pulse-recording 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .rec-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(69, 10, 10, 0.9);
      border: 1px solid rgba(239, 68, 68, 0.6);
      padding: 4px 14px;
      border-radius: 9999px;
      color: #f87171;
      font-size: 13px;
      font-weight: 800;
      font-family: monospace;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
    }

    .seal-badge {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(59, 130, 246, 0.6);
      color: #60a5fa;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-family: monospace;
      font-weight: 700;
    }

    .bridge-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 680px;
      justify-content: center;
    }

    .btn-done {
      flex: 1;
      padding: 16px 24px;
      background: #059669;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
      transition: all 0.15s;
    }
    .btn-done:hover { background: #10b981; }

    .btn-cancel {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

    #bridge-error {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      padding: 10px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      display: none;
      max-width: 680px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- EMBEDDED GOOGLE APPS SCRIPT WEB APP (ORGANIZATION AUTHENTICATED) -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/a/macros/myntra.com/s/AKfycbzMG3DolVegPYZy_TCdcpjeJR5rGxE1QvqH7mkvbcbLK-uA2iLVgQ8MKpLgEQ1wR25v/exec" 
    allow="camera; microphone" 
    allowfullscreen
  ></iframe>

  <!-- TOP-LEVEL CAMERA BRIDGE OVERLAY -->
  <div id="camera-bridge-overlay">
    <div id="bridge-error"></div>

    <div class="bridge-viewport-card">
      <div class="overlay-top-bar">
        <div class="rec-badge">
          <span class="rec-dot animate-rec"></span>
          <span>● REC</span>
          <span id="bridgeRecTimer">00:00</span>
        </div>
        <div class="seal-badge" id="bridgeSealDisplay">SEAL: --</div>
      </div>

      <video id="bridge-video" autoplay playsinline muted></video>
    </div>

    <div class="bridge-controls">
      <button id="btnBridgeDone" class="btn-done" onclick="finishAndSendRecording()">
        ✓ Done (Finish & Scan Bag ID)
      </button>
      <button class="btn-cancel" onclick="cancelCameraBridge()">
        ✕ Cancel
      </button>
    </div>
  </div>

  <script>
    var overlay = document.getElementById('camera-bridge-overlay');
    var video = document.getElementById('bridge-video');
    var errorBox = document.getElementById('bridge-error');
    var gasFrame = document.getElementById('app-frame');
    var timerDisplay = document.getElementById('bridgeRecTimer');
    var sealDisplay = document.getElementById('bridgeSealDisplay');

    var activeStream = null;
    var mediaRecorder = null;
    var recordedChunks = [];
    var timerInterval = null;
    var startTime = 0;
    var recordingStartISO = '';
    var recordingEndISO = '';
    var elapsedSeconds = 0;
    var currentSealId = '';
    var gasWindow = null;

    // Listen for messages from the embedded GAS iframe
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'START_RECORDING') {
        currentSealId = data.sealId || '';
        gasWindow = event.source;
        startCameraBridgeRecording();
      }

      if (data.type === 'STOP_RECORDING') {
        finishAndSendRecording();
      }

      if (data.type === 'CLOSE_CAMERA') {
        closeCameraBridge();
      }
    });

    function startCameraBridgeRecording() {
      errorBox.style.display = 'none';
      sealDisplay.textContent = 'SEAL: ' + currentSealId;
      overlay.classList.add('active');

      navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 854 },
          height: { ideal: 480 },
          frameRate: { ideal: 24, max: 30 }
        },
        audio: false
      }).then(function(stream) {
        activeStream = stream;
        video.srcObject = stream;

        // Initialize MediaRecorder (VP9/VP8 ~300 kbps)
        recordedChunks = [];
        var mimeType = 'video/webm;codecs=vp9';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=vp8';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: mimeType,
          videoBitsPerSecond: 300000
        });

        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.start(1000);

        // Capture wall-clock start time
        startTime = Date.now();
        recordingStartISO = new Date().toISOString();
        recordingEndISO = '';
        elapsedSeconds = 0;
        timerDisplay.textContent = '00:00';
        clearInterval(timerInterval);
        timerInterval = setInterval(function() {
          elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
          var m = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
          var s = (elapsedSeconds % 60).toString().padStart(2, '0');
          timerDisplay.textContent = m + ':' + s;
        }, 1000);

      }).catch(function(err) {
        showError('Camera access denied or failed: ' + err.message);
      });
    }

    function finishAndSendRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        closeCameraBridge();
        return;
      }

      clearInterval(timerInterval);
      recordingEndISO = new Date().toISOString();

      mediaRecorder.onstop = function() {
        var recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
        var sizeInMB = (recordedBlob.size / (1024 * 1024)).toFixed(2);

        // Convert Blob to Base64
        var reader = new FileReader();
        reader.onloadend = function() {
          var base64Data = reader.result;

          // Send result back to GAS iframe
          var targetWindow = gasWindow || gasFrame.contentWindow;
          if (targetWindow) {
            targetWindow.postMessage({
              type: 'RECORDING_COMPLETE',
              videoBase64: base64Data,
              durationSeconds: elapsedSeconds,
              fileSizeMB: sizeInMB,
              recordingStartISO: recordingStartISO,
              recordingEndISO: recordingEndISO
            }, '*');
          }

          closeCameraBridge();
        };
        reader.readAsDataURL(recordedBlob);
      };

      mediaRecorder.stop();
    }

    function cancelCameraBridge() {
      var targetWindow = gasWindow || gasFrame.contentWindow;
      if (targetWindow) {
        targetWindow.postMessage({ type: 'RECORDING_CANCELLED' }, '*');
      }
      closeCameraBridge();
    }

    function closeCameraBridge() {
      clearInterval(timerInterval);
      if (activeStream) {
        activeStream.getTracks().forEach(function(t) { t.stop(); });
        activeStream = null;
      }
      if (video) video.srcObject = null;
      overlay.classList.remove('active');
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
  </script>
</body>
</html>
